  <rect width="800" height="600" filter="url(#t-grain)" opacity="0.04"/>
  <text x="40" y="572" font-family="Inter, sans-serif" font-size="13" letter-spacing="2" fill="#5d6470" opacity="0.55">占位 · RUNWAY LOOKBOOK</text>
