<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="800" y2="600"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f6"/></linearGradient>
    <linearGradient id="t-warm" x1="0" y1="0" x2="0" y2="600"><stop offset="0" stop-color="#c9ad7c" stop-opacity="0.35"/><stop offset="1" stop-color="#e8e4da" stop-opacity="0.3"/></linearGradient>
    <linearGradient id="t-fig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b93a1"/><stop offset="1" stop-color="#c9cfd9"/></linearGradient>
    <filter id="t-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#t-bg)"/>
